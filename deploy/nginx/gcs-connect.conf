# ==============================================================================
# GCS CONNECT — Production Nginx Reverse Proxy Configuration
# Phase 14: Hostinger Production Deployment Automation
# Domain: connect.globalcrestsolutions.com
# ==============================================================================

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=gcs_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=gcs_auth_limit:10m rate=5r/s;

# Upstream Backend Nodes
upstream gcs_next_frontend {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream gcs_express_api {
    server 127.0.0.1:3001;
    keepalive 64;
}

# HTTP — Canonical Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name connect.globalcrestsolutions.com;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Secure Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name connect.globalcrestsolutions.com;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/connect.globalcrestsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connect.globalcrestsolutions.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/connect.globalcrestsolutions.com/chain.pem;

    # Modern TLS 1.3 & 1.2 Cryptographic Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:GCS_SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Enterprise Security Headers (HSTS, CSP, Anti-Sniff, Anti-Clickjacking)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;

    # Client Upload Buffer for Encrypted Media Files
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Gzip Compression for Performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. API Endpoints Proxying (/api/*)
    location /api/ {
        limit_req zone=gcs_api_limit burst=50 nodelay;

        proxy_pass http://gcs_express_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Strict Rate Limit for Auth Endpoints (/api/auth/*)
    location /api/auth/ {
        limit_req zone=gcs_auth_limit burst=10 nodelay;

        proxy_pass http://gcs_express_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 2. Socket.IO Real-Time & WebRTC Signaling Proxying (/socket.io/*)
    location /socket.io/ {
        proxy_pass http://gcs_express_api;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for persistent long-lived WebSocket sessions
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # 3. Next.js Static Assets Caching (/_next/static/*)
    location /_next/static/ {
        proxy_pass http://gcs_next_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # 1 Year Immutable Cache
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 4. Next.js Public Static Files
    location ~* \.(ico|jpg|jpeg|png|gif|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://gcs_next_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 5. Next.js Application Frontend Proxying (All other requests)
    location / {
        proxy_pass http://gcs_next_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
